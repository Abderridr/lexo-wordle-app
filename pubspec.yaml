name: lexo_wordleapp
description: "lexo wordle appp."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  characters: ^1.4.0
  url_launcher: ^6.3.2
  google_fonts: ^6.2.1
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "logo.jpg"
  min_sdk_android: 21

dependency_overrides:
  win32: ^5.10.0
