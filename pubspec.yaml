name: arabic_wordle
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # google_mobile_ads: ^4.0.0  # removed for iOS-only build
  shared_preferences: ^2.2.0
  flutter_animate: ^4.0.0
  intl: ^0.18.0
  characters: ^1.3.0
  url_launcher: ^6.1.0
  google_fonts: ^5.0.0
  confetti: ^0.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "logo.jpg"
  min_sdk_android: 21
